name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            chochinize/stack-index:latest
            chochinize/stack-index:${{ github.sha }}
          cache-from: type=registry,ref=chochinize/stack-index:latest
          cache-to: type=inline

  # Fail-closed GitOps bump: only runs if the image build+push succeeded. Rewrites the
  # kustomize image tag to this commit's SHA and commits it back; ArgoCD auto-syncs the
  # change. This path is NOT in the build trigger, so the bump commit won't loop.
  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin deployment to built image
        run: sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" base/kustomization.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }}" || { echo "no change"; exit 0; }
          git push
