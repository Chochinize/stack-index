name: Build and Deploy

# This workflow deliberately uses NO marketplace actions (the repo's Actions policy
# blocks non-owner actions). Checkout is a plain git clone with the built-in token;
# the image is built and pushed with the Docker CLI already present on the runner.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (plain git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Build and push image (amd64)
        working-directory: repo
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build -t chochinize/stack-index:latest -t "chochinize/stack-index:${SHA}" .
          docker push chochinize/stack-index:latest
          docker push "chochinize/stack-index:${SHA}"

  # Fail-closed GitOps bump: runs only if the image build+push succeeded. Rewrites the
  # kustomize image tag to this commit's SHA and pushes it back; ArgoCD auto-syncs.
  # base/** is not a build trigger, so this commit does not loop.
  bump:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout (plain git)
        run: git clone --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Pin deployment to built image and push
        working-directory: repo
        run: |
          sed -i "s|newTag:.*|newTag: ${SHA}|" base/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/kustomization.yaml
          git commit -m "ci: deploy ${SHA}" || { echo "no change"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
