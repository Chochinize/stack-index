# Shared security headers, included from the server block and from every
# location block that sets its own add_header (which otherwise suppresses
# inheritance of these from the parent level — see /_astro/ and /healthz
# in nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# unsafe-inline is required: static Astro build with no per-request nonce
# generation, shipping inline <script is:inline> blocks (theme toggle, mobile
# nav, client-side tool search/filter) and an inline style attribute on the
# search form. No runtime backend calls exist on this site (pure static
# content), so connect-src stays self-only as a safe default.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
