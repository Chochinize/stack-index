server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative so the public HTTPS scheme from the
    # reverse proxy is never downgraded to the container's internal HTTP scheme.
    absolute_redirect off;

    # Cloudflare Tunnel reaches this container over HTTP, so redirect the
    # alternate hostname explicitly without leaking the internal port.
    if ($host = www.localfirststack.com) {
        return 308 https://localfirststack.com$request_uri;
    }

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

    # Security headers.
    include /etc/nginx/conf.d/security-headers.conf;

    # Liveness/readiness probe target.
    location = /healthz {
        access_log off;
        # add_header here means this location does NOT inherit the server-level
        # add_header directives above, so the include is repeated explicitly.
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Astro emits directory-style pages (/tools/immich/index.html). Resolve a request
    # to the file, its directory index, or a matching .html, else the 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fingerprinted build assets — cache hard.
    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
