server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative so the public HTTPS scheme from the
    # reverse proxy is never downgraded to the container's internal HTTP scheme.
    absolute_redirect off;

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness/readiness probe target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Astro emits directory-style pages (/tools/immich/index.html). Resolve a request
    # to the file, its directory index, or a matching .html, else the 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fingerprinted build assets — cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
